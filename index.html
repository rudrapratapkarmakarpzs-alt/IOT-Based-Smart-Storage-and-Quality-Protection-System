<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=dashboard/">
  <title>Smart Storage & Quality Protection System</title>
  <style>
    body {
      background: #060b10;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    h1 {
      color: #f8fafc;
      font-size: 1.4rem;
      margin: 0 0 8px 0;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
  </style>
  <script>
    // Immediate redirect to dashboard
    window.location.replace("dashboard/");
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">🌿</div>
    <h1>Smart Storage System</h1>
    <p>ESP32-S3 Storage Risk AI & Post-Harvest Protection</p>
    <a href="dashboard/" class="btn">Open Dashboard &rarr;</a>
  </div>
</body>
</html>
